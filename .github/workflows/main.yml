name: Snyk Code + Open Source + IaC

on:
  push:
    branches: ["rag"]
  pull_request:
    branches: ["rag"]

permissions:
  contents: read
  security-events: write

jobs:
  snyk-scan:
    runs-on: ubuntu-latest

    steps:
      # Checkout source
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Snyk CLI
      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      # Authenticate Snyk (MANDATORY)
      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      # ---------- Snyk Code (SAST) ----------
      # Generates VALID SARIF only
      - name: Snyk Code Test (SARIF)
        run: snyk code test --sarif --json-file-output=snyk-code.sarif
        continue-on-error: true

      # ---------- Snyk Open Source (SCA) ----------
      - name: Snyk Open Source Scan
        run: snyk monitor --all-projects
        continue-on-error: true

      # ---------- Snyk IaC ----------
      - name: Snyk IaC Scan
        run: snyk iac test
        continue-on-error: true

