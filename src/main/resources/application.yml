spring:
  application:
    name: rag-chatbot
  
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:password}
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: 6333
  collection-name: rag-documents
  vector-size: 384  # BGE-small-en-v1.5 embedding size

deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-032df39c947b4979b1f556ec51c03124}
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-chat

embedding:
  model-name: BAAI/bge-small-en-v1.5
  model-path: ./models

server:
  port: 8080
